# Fase 2 — infra local: Kafka (KRaft) + Postgres + Grafana
# Uso com Podman:
#   cp .env.example .env
#   podman compose up -d
#   podman compose logs -f kafka
# Tópicos `transactions` / `fraud-alerts` são auto-criados no primeiro send.

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: fraud-detection-v1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 5 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:16-alpine
    container_name: fraud-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frauddb}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudpass_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Inicializa o schema unificado (transactions + fraud_alerts) na 1ª subida
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fraud} -d $${POSTGRES_DB:-frauddb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.1
    container_name: fraud-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      # Dashboard importado manualmente via UI (Import -> Upload JSON).
      # O JSON atual espera Prometheus; exporter ou adaptação p/ Postgres na fase 2.
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/fraud-dashboard.json:ro,z
    depends_on:
      - postgres

volumes:
  kafka-data:
  pgdata:
  grafana-data:
